name: mobile release

# The Android app under mobile/. Bump mobile.versionName / versionCode in
# mobile/gradle.properties, commit, tag mobile-vX.Y.Z, push the tag. This
# builds the release-signed APK and publishes a GitHub Release. The
# prefix keeps desk and web tags from ever building an APK. Never upload
# a locally built APK: it is debug-signed and phones that installed it
# can never upgrade to a release-signed one (see mobile/RELEASE.md).

on:
  push:
    tags:
      - 'mobile-v*'

permissions:
  contents: read

defaults:
  run:
    working-directory: mobile

jobs:
  tagcheck:
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.parse.outputs.version_name }}
      version_code: ${{ steps.parse.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4
      - id: parse
        run: |
          TAG="${GITHUB_REF#refs/tags/mobile-v}"
          VERSION_CODE=$(grep -E '^mobile\.versionCode=' gradle.properties | cut -d= -f2 | tr -d ' ')
          VERSION_NAME=$(grep -E '^mobile\.versionName=' gradle.properties | cut -d= -f2 | tr -d ' ')
          if [ "$TAG" != "$VERSION_NAME" ]; then
            echo "::error::tag mobile-v$TAG does not match mobile.versionName=$VERSION_NAME in mobile/gradle.properties"
            exit 1
          fi
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

  build-android:
    needs: tagcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require the signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          : "${KEYSTORE_BASE64:?RELEASE_KEYSTORE_BASE64 secret is not set; see mobile/RELEASE.md}"
          : "${STORE_PASSWORD:?RELEASE_STORE_PASSWORD secret is not set}"
          : "${KEY_ALIAS:?RELEASE_KEY_ALIAS secret is not set}"
          : "${KEY_PASSWORD:?RELEASE_KEY_PASSWORD secret is not set}"
          umask 077
          mkdir -p ~/.config/drive-mobile
          echo "$KEYSTORE_BASE64" | base64 -d > ~/.config/drive-mobile/release.keystore
          {
            echo "storeFile=$HOME/.config/drive-mobile/release.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > ~/.config/drive-mobile/keystore.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-36" "build-tools;36.0.0"

      - name: Build release APK
        env:
          RELEASE_KEYSTORE_PROPS: /home/runner/.config/drive-mobile/keystore.properties
        run: ./gradlew :androidApp:assembleRelease --no-daemon

      - name: Stage
        env:
          VERSION_NAME: ${{ needs.tagcheck.outputs.version_name }}
        run: |
          set -euo pipefail
          APK=androidApp/build/outputs/apk/release/androidApp-release.apk
          test -f "$APK"
          cp "$APK" "drive-mobile-$VERSION_NAME.apk"
          sha256sum "drive-mobile-$VERSION_NAME.apk" > "drive-mobile-$VERSION_NAME.apk.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            mobile/drive-mobile-*.apk
            mobile/drive-mobile-*.apk.sha256

  release:
    needs: [tagcheck, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
      - uses: softprops/action-gh-release@v2
        with:
          name: Drive mobile ${{ needs.tagcheck.outputs.version_name }}
          generate_release_notes: true
          files: |
            drive-mobile-*.apk
            drive-mobile-*.apk.sha256
