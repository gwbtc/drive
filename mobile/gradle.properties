org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4g
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# The app version, in one place: :androidApp uses it for versionCode /
# versionName and .github/workflows/release.yml checks the pushed tag
# against versionName before it builds anything.
mobile.versionCode=1
mobile.versionName=0.1.0
